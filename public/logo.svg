  <path d="M 120 40 L 98 94 L 105 94 L 120 54 Z" fill="#002c6b" opacity="0.35" />
  <path d="M 120 40 L 120 73 L 128 94 L 142 94 Z" fill="#38bdf8" opacity="0.3" />

  <!-- Wave Swoosh on A -->
  <path d="M 88 77 C 98 67, 116 67, 126 73 C 145 78, 160 63, 172 61 C 163 71, 148 83, 127 81 C 114 80, 103 84, 88 77 Z" fill="#0099ff" />
  <path d="M 94 76 C 104 69, 120 70, 130 74 C 146 80, 162 70, 172 61 C 160 74, 142 86, 125 83 C 110 81, 101 82, 94 76 Z" fill="#0284c7" opacity="0.8" />

  <!-- Stars -->
