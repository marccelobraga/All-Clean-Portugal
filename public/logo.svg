  <text x="120" y="151" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="15" letter-spacing="4" fill="#001e47">SOLUTION</text>
  <line x1="172" y1="146" x2="202" y2="146" stroke="#00224f" stroke-width="2.5" stroke-linecap="round" />

  <!-- Slogan -->
  <text x="120" y="173" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10.5" letter-spacing="1.2" fill="#005ecb">TUDO LIMPO, TUDO PRONTO.</text>
  <path d="M 82 181 Q 120 187 158 181" stroke="#0077ff" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Bottom Wave -->
  <path d="M 44 196 C 68 182, 102 206, 138 198 C 168 191, 188 197, 196 200 C 176 218, 149 228, 120 228 C 91 228, 64 218, 44 196 Z" fill="#002b66" />
  <path d="M 47 195 C 68 184, 100 200, 134 194 C 162 189, 185 194, 195 198 C 190 206, 180 213, 168 217 C 138 213, 104 206, 74 210 C 62 206, 53 200, 47 195 Z" fill="url(#waveGrad)" />
