  </defs>

  <!-- Outer Circular Rim -->
  <circle cx="120" cy="120" r="116" fill="url(#ringGrad)" stroke="#002661" stroke-width="3" />
  <circle cx="120" cy="120" r="110" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.8" />

  <!-- Inner Disc -->
  <circle cx="120" cy="120" r="102" fill="url(#discGrad)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Letter 'A' -->
